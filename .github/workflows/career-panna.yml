name: Career panna (step 09)

# Rebuilds career_panna.parquet (estimated-skills step 09: decayed career xRAPM shrunk
# to the skill-SPM prior) on a runner, from the caches on pannadata releases. Until
# 2026-10-18 this step only ran on a laptop and uploaded only when a flag was set, so
# the published file fell a month behind the code (panna#257). Off main/dev the
# publish gate (PANNA_PUBLISH_DISABLED) forces upload off: a branch run is a dry build
# whose output is the run's artifact and summary only (artifact: career-panna).
# Weekly schedule (Pete, 2026-11-17): with no schedule the site's Panna sat at the
# 2026-10-18 build for four weeks. A scheduled run uses main's copy and publishes.
on:
  schedule:
    # 20:00 UTC Monday = 7am Sydney Tuesday (AEDT), after Monday's opta-pipeline has
    # refreshed 03_splints.rds and before Wednesday's predictions run.
    - cron: "0 20 * * 1"
  workflow_dispatch:
    inputs:
      prior_asset:
        description: Skill-SPM prior asset on predictions-cache
        default: 03_skill_spm.rds
      upload:
        description: Publish career_panna.parquet to ratings-data (main/dev only)
        type: boolean
        default: false
      force_publish:
        description: Publish even if the rank check fails (a deliberate model or prior change)
        type: boolean
        default: false
  push:
    branches: ["career-panna-*"]
    paths: [".github/workflows/career-panna.yml", "data-raw/estimated-skills/09_career_panna.R"]

env:
  PANNA_PUBLISH_DISABLED: ${{ (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev') && 'true' || 'false' }}
  # The live prior (the panna#257 fix, promoted 2026-10-18); a dispatch can name another asset.
  PRIOR_ASSET: ${{ inputs.prior_asset || '03_skill_spm.rds' }}
  # A scheduled run has no inputs, so it opts in to publishing here.
  UPLOAD: ${{ (github.event_name == 'schedule' || inputs.upload) && 'true' || 'false' }}
  GH_TOKEN: ${{ github.token }}

permissions:
  contents: read

# Shares opta-pipeline's group: both vb_publish() to ratings-data, which reads its
# bus_manifest.json at the start and rewrites it at the end, so two runs at once
# would lose one side's entries. Queues behind it, never cancels.
concurrency:
  # main/dev share opta-pipeline so release writes never overlap. Any other ref is a dry
  # build (PANNA_PUBLISH_DISABLED), so it gets its own queue: GitHub keeps one pending
  # run per group, and a pending branch run would otherwise replace a pending publish.
  group: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && 'opta-pipeline' || format('opta-pipeline-dry-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  career-panna:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Publish gate
        run: |
          if [ "$PANNA_PUBLISH_DISABLED" = "true" ]; then
            echo "::warning title=Publishing disabled::ref $GITHUB_REF is not main or dev, so this run builds but uploads nothing."
            echo "> **Publishing disabled:** ref \`$GITHUB_REF\` is not main or dev; this is a dry build." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: '4.5.0'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          cache-version: 11
          extra-packages: |
            any::devtools
            any::piggyback
            any::arrow

      - name: Download inputs (public pannadata releases)
        run: |
          set -euo pipefail
          mkdir -p data-raw/cache-opta data-raw/cache-skills ../pannadata/data/opta /tmp/pub
          gh release download predictions-cache -R peteowen1/pannadata -p 03_splints.rds -D data-raw/cache-opta
          gh release download predictions-cache -R peteowen1/pannadata -p "$PRIOR_ASSET" -D /tmp
          mv "/tmp/$PRIOR_ASSET" data-raw/cache-skills/03_skill_spm.rds
          gh release download opta-latest -R peteowen1/pannadata -p opta_fixtures.parquet -D ../pannadata/data/opta
          gh release download ratings-data -R peteowen1/pannadata -p career_panna.parquet -D /tmp/pub
          ls -la data-raw/cache-opta data-raw/cache-skills ../pannadata/data/opta /tmp/pub
          echo "prior: $PRIOR_ASSET ($(sha256sum data-raw/cache-skills/03_skill_spm.rds | cut -c1-16))"

      # Build only. Publishing is its own step after the rank check, so an unattended
      # scheduled run cannot replace the live file with a build that reorders it.
      - name: Step 09
        run: |
          Rscript -e "upload_career_panna <- FALSE; source('data-raw/estimated-skills/09_career_panna.R')"

      - name: Compare with the published file
        id: compare
        run: |
          cat > /tmp/compare.R <<'EOF'
          suppressMessages(library(data.table))
          pub <- as.data.table(arrow::read_parquet("/tmp/pub/career_panna.parquet"))
          new <- as.data.table(arrow::read_parquet("../pannadata/data/opta/career_panna.parquet"))
          spm <- readRDS("data-raw/cache-skills/03_skill_spm.rds")
          pr <- merge(as.data.table(spm$offense_spm_ratings)[, .(player_id, po = offense_spm)],
                      as.data.table(spm$defense_spm_ratings)[, .(player_id, pd = defense_spm)], by = "player_id")
          pub[, pub_rank := frank(-panna, ties.method = "min")]
          new[, rank := frank(-panna, ties.method = "min")]
          m <- merge(new, pub[, .(player_id, pub_panna = panna, pub_rank)], by = "player_id", all.x = TRUE)
          m <- merge(m, pr, by = "player_id", all.x = TRUE)
          m[, prior := po + pd][, from_recent := panna - prior]
          rho <- cor(m$rank, m$pub_rank, method = "spearman", use = "complete.obs")
          cat(sprintf("rows: new %d, published %d; rank Spearman vs published %.3f\n", nrow(new), nrow(pub), rho))
          cat(sprintf("spearman=%.4f\nrows_new=%d\nrows_pub=%d\n", rho, nrow(new), nrow(pub)),
              file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
          cat("\nTop 20, new build (panna = prior + from_recent; published rank for comparison):\n")
          print(m[order(rank)][1:20, .(player_name, rank, panna = round(panna, 3), prior = round(prior, 3),
                                       from_recent = round(from_recent, 3), pub_rank, mins = round(total_minutes))])
          cat("\nBiggest falls from the published top 100:\n")
          print(m[pub_rank <= 100][order(-(rank - pub_rank))][1:10, .(player_name, pub_rank, rank)])
          cat("\nBiggest rises into the new top 50:\n")
          print(m[rank <= 50][order(rank - pub_rank)][1:10, .(player_name, pub_rank, rank)])
          EOF
          Rscript /tmp/compare.R | tee -a "$GITHUB_STEP_SUMMARY"

      # upload-artifact takes paths inside the workspace only
      - name: Stage the output for the artifact
        run: mkdir -p _out && cp ../pannadata/data/opta/career_panna.parquet _out/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: career-panna
          path: _out/career_panna.parquet
          retention-days: 14

      # A plain weekly rebuild scored 1.000 against the published file on 2026-10-18;
      # the deliberate prior change that day (panna#257) scored 0.899. MIN_SPEARMAN sits
      # between them: a week of new matches passes, a silent reordering stops here and
      # leaves the live file alone. A deliberate change is published with force_publish.
      # Row loss is vb_publish's job (min_row_frac = 0.9).
      - name: Rank check and publish
        if: env.UPLOAD == 'true' && env.PANNA_PUBLISH_DISABLED != 'true'
        env:
          GITHUB_PAT: ${{ secrets.WORKFLOW_PAT }}
          MIN_SPEARMAN: "0.95"
          SPEARMAN: ${{ steps.compare.outputs.spearman }}
          ROWS_NEW: ${{ steps.compare.outputs.rows_new }}
          FORCE: ${{ inputs.force_publish && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [ -z "$SPEARMAN" ] || [ "$SPEARMAN" = "NA" ]; then
            echo "::error title=No rank check::the compare step produced no Spearman value; not publishing."
            exit 1
          fi
          if awk -v s="$SPEARMAN" -v m="$MIN_SPEARMAN" 'BEGIN { exit !(s < m) }'; then
            if [ "$FORCE" != "true" ]; then
              echo "::error title=Rank check failed::rank Spearman vs published $SPEARMAN < $MIN_SPEARMAN; the live file is unchanged. If the change is deliberate, re-run by dispatch with upload and force_publish."
              echo "> **Not published:** rank Spearman vs published $SPEARMAN < $MIN_SPEARMAN." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "::warning title=Forced publish::rank Spearman $SPEARMAN < $MIN_SPEARMAN, published because force_publish was set."
          fi
          Rscript -e "devtools::load_all(quiet = TRUE); m <- vb_publish('../pannadata/data/opta/career_panna.parquet', repo = 'peteowen1/pannadata', tag = 'ratings-data', rows = c(career_panna.parquet = as.integer(Sys.getenv('ROWS_NEW'))), min_row_frac = 0.9); cat(sprintf('Uploaded career_panna.parquet to ratings-data, generation %s.\n', m\$generation))"
          echo "> **Published** (rank Spearman vs published $SPEARMAN)." >> "$GITHUB_STEP_SUMMARY"
