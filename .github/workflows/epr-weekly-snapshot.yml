name: Weekly EPR Snapshot

# Builds opta_epr_weekly.parquet (~780 MB) — per-(player, snapshot_date) EPR via
# calculate_epr_regression(). Mirrors psr-weekly-snapshot.yml. Split into its own
# workflow (not the predictions pipeline) for the same reason PSR was: it's a
# heavy, self-contained snapshot build that shouldn't redden the daily chain.
#
# Cadence: WEEKLY. EPR uses a 900-day decay, so a single match barely moves it —
# daily would be wasted compute. This closes the gap where opta_epr_weekly had
# NO automated rebuild and went ~3.5 weeks stale (May 29 -> Jun 23 2026).
#
# build_epr_weekly.R is INCREMENTAL (2026-06-23): it reuses snapshots older than
# a 28-day buffer from the existing release parquet and recomputes only the
# recent window — ~3 min vs ~25 min full rebuild, output verified bit-identical.
# A full rebuild happens only on the first run (no existing parquet to download)
# or when EPR_FORCE_FULL_REBUILD=1 is set (e.g. after a method/offset change).

on:
  schedule:
    # Wednesday 11 AM UTC — after the daily scrape/predictions chain and the
    # 10 AM PSR snapshot, so it reads the freshest current-season game logs.
    - cron: '0 11 * * 3'
  workflow_dispatch:
    inputs:
      force_full_rebuild:
        description: 'Recompute every snapshot (slow ~25 min) instead of incremental'
        type: boolean
        default: false
      game_logs_run_id:
        description: 'Build from the game logs of Game Logs Rebuild (dry) run ids, space-separated, a later run replacing an earlier one season by season (instead of blog-latest; forces a full rebuild; never published)'
        type: string
        required: false
        default: ''

concurrency:
  # main/dev share panna-release-writer so release writes never overlap. Any other ref is a dry
  # build (PANNA_PUBLISH_DISABLED), so it gets its own queue: GitHub keeps one pending
  # run per group, and a pending branch run would otherwise replace a pending publish.
  group: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') && 'panna-release-writer' || format('panna-release-writer-dry-{0}', github.ref) }}
  cancel-in-progress: false

env:
  GITHUB_PAT: ${{ secrets.WORKFLOW_PAT }}
  R_KEEP_PKG_SOURCE: yes
  # R026: only main and dev may publish. Scheduled and repository_dispatch runs
  # use the default branch (main). A workflow_dispatch from any other branch
  # builds but uploads nothing: the R scripts force their upload_* flags off and the
  # workflow upload steps are gated on it (vb_publish() itself does not read it).
  PANNA_PUBLISH_DISABLED: ${{ (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev') && 'true' || 'false' }}

jobs:
  epr-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      - name: Publish gate (R026)
        run: |
          if [ "$PANNA_PUBLISH_DISABLED" = "true" ]; then
            echo "::warning title=Publishing disabled::ref $GITHUB_REF is not main or dev, so this run builds but uploads nothing."
            echo "> [!WARNING]" >> "$GITHUB_STEP_SUMMARY"
            echo "> **Publishing disabled:** ref \`$GITHUB_REF\` is not main or dev; every upload is forced off." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Publishing allowed on $GITHUB_REF."
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
          use-public-rspm: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 2
          extra-packages: |
            any::devtools
            any::piggyback
            any::arrow
            any::data.table
            any::Matrix
            any::glmnet
            any::cli
          needs: |
            devtools

      - name: Download inputs
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          GAME_LOGS_RUN_ID: ${{ inputs.game_logs_run_id }}
        run: |
          # build_epr_weekly.R uses hardcoded RELATIVE paths (cwd = repo root):
          #   data-raw/cache-predictions-opta/game_logs_*.parquet  (per-season logs)
          #   data-raw/cache-opta/team_season_strength.parquet      (opp_def_rating)
          #   ../pannadata/data/opta/opta_lineups.parquet           (opponents)
          #   ../pannadata/data/opta/opta_epr_weekly.parquet        (existing, for incremental)
          CACHE_PRED="data-raw/cache-predictions-opta"
          CACHE_OPTA="data-raw/cache-opta"
          PD_OPTA="../pannadata/data/opta"
          mkdir -p "$CACHE_PRED" "$CACHE_OPTA" "$PD_OPTA"

          if [ -n "$GAME_LOGS_RUN_ID" ]; then
            # A rebuild being gated must never reach opta-latest.
            if [ "$PANNA_PUBLISH_DISABLED" != "true" ]; then
              echo "FATAL: game_logs_run_id is for branch dry runs only; this ref publishes"; exit 1
            fi
            mkdir -p /tmp/gl_parts
            for rid in $GAME_LOGS_RUN_ID; do
              echo "== per-season game logs (artifacts of rebuild run $rid) =="
              rm -rf /tmp/gl_art && mkdir -p /tmp/gl_art
              gh run download "$rid" --repo peteowen1/panna --pattern 'game-logs-*' --dir /tmp/gl_art
              # A later run replaces an earlier one season by season: drop every
              # part already held for a season this run carries, so a season
              # re-run in quarters never mixes with its earlier halves.
              for sz in $(find /tmp/gl_art -name 'game_logs_*__part*.parquet' -printf '%f\n' | sed -E 's/__part.*//' | sort -u); do
                rm -f /tmp/gl_parts/"${sz}"__part*.parquet
              done
              find /tmp/gl_art -name 'game_logs_*__part*.parquet' -exec mv -f {} /tmp/gl_parts/ \;
            done
            # The rebuild writes each season in two halves (by league): join them.
            cat > /tmp/join_parts.R <<'EOF'
          suppressMessages(library(data.table))
          fs <- list.files("/tmp/gl_parts", "^game_logs_.*__part[0-9]+(of[0-9]+)?[.]parquet$", full.names = TRUE)
          for (k in unique(sub("__part[0-9]+(of[0-9]+)?[.]parquet$", "", basename(fs)))) {
            p <- fs[startsWith(basename(fs), paste0(k, "__"))]
            d <- data.table::rbindlist(lapply(p, function(f) data.table::as.data.table(arrow::read_parquet(f))),
                                       use.names = TRUE, fill = TRUE)
            stopifnot(!anyDuplicated(d[, .(player_id, match_id)]))
            arrow::write_parquet(d, file.path("data-raw/cache-predictions-opta", paste0(k, ".parquet")))
            cat(sprintf("  %s: %d half(s), %d rows, leagues %s\n", k, length(p), nrow(d),
                        paste(sort(unique(d$league)), collapse = " ")))
          }
          EOF
            Rscript /tmp/join_parts.R
            n_pub=$(gh release view blog-latest --repo peteowen1/pannadata --json assets \
                      --jq '[.assets[].name | select(test("^game_logs_[0-9]{4}-[0-9]{4}[.]parquet$"))] | length')
            n_art=$(ls "$CACHE_PRED"/game_logs_*.parquet | wc -l)
            echo "  $n_art rebuilt seasons (blog-latest has $n_pub)"
            [ "$n_art" -eq "$n_pub" ] || { echo "FATAL: rebuild has $n_art seasons, blog-latest $n_pub; a partial history would bias EPR"; exit 1; }
          else
            echo "== per-season game logs (blog-latest) =="
            # Matches game_logs_<season>.parquet only (not the game_logs.parquet alias,
            # which build_epr_weekly's ^game_logs_.* pattern excludes anyway).
            gh release download blog-latest --repo peteowen1/pannadata \
              --pattern "game_logs_*.parquet" --dir "$CACHE_PRED"
            echo "  $(ls "$CACHE_PRED"/game_logs_*.parquet | wc -l) game_logs files"
          fi

          echo "== team_season_strength (predictions-cache) =="
          # REQUIRED, not best-effort: without it opp_def_rating zeroes out for
          # EVERY row (EPR loses its opponent-strength control across all history)
          # — a silent degraded publish. Fail loud instead (feedback: never use a
          # constant fallback to hide a missing input). It's built by
          # sketch_team_strength.R; if this asset ages out, re-run that + republish
          # to predictions-cache (the opta-pipeline only uploads it on local runs).
          gh release download predictions-cache --repo peteowen1/pannadata \
            --pattern "team_season_strength.parquet" --dir "$CACHE_OPTA"
          echo "  downloaded (opp_def_rating control available)"

          echo "== opta_lineups (opta-latest) =="
          gh release download opta-latest --repo peteowen1/pannadata \
            --pattern "opta_lineups.parquet" --dir "$PD_OPTA"

          echo "== existing opta_epr_weekly for incremental reuse (opta-latest) =="
          if gh release download opta-latest --repo peteowen1/pannadata \
               --pattern "opta_epr_weekly.parquet" --dir "$PD_OPTA" 2>/dev/null; then
            echo "  downloaded — incremental run (recompute recent snapshots only)"
            # The build overwrites it in place; keep the published copy to compare against.
            cp "$PD_OPTA/opta_epr_weekly.parquet" /tmp/published_epr_weekly.parquet
          else
            echo "  not found — FIRST RUN, full rebuild (~25 min)"
          fi

          # Validate the must-haves (lineups + game logs + opponent-strength)
          MISSING=0
          [ -f "$PD_OPTA/opta_lineups.parquet" ] || { echo "FATAL: opta_lineups.parquet missing"; MISSING=1; }
          [ -f "$CACHE_OPTA/team_season_strength.parquet" ] || { echo "FATAL: team_season_strength.parquet missing (opp_def_rating would zero out)"; MISSING=1; }
          ls "$CACHE_PRED"/game_logs_*.parquet >/dev/null 2>&1 || { echo "FATAL: no game_logs_*.parquet"; MISSING=1; }
          [ "$MISSING" -eq 0 ] || exit 1

      - name: Build weekly EPR snapshots
        # build_epr_weekly.R now publishes opta_epr_weekly.parquet to opta-latest
        # itself via vb_publish() (manifest-gated) -- see section 6b of the
        # script. The separate `gh release upload` step this workflow used to
        # run here was removed as redundant (Pete's decision 2026-07-14,
        # unifying pipeline uploads onto vb_publish).
        env:
          EPR_FORCE_FULL_REBUILD: ${{ (inputs.force_full_rebuild == true || inputs.game_logs_run_id != '') && '1' || '' }}
          GITHUB_PAT: ${{ secrets.WORKFLOW_PAT }}
        run: |
          Rscript data-raw/match-predictions-opta/build_epr_weekly.R

      # New build against the published file, latest snapshot: does a change of
      # method move the ranking, and who moved. Read-only; runs on every ref.
      - name: Compare with the published file
        run: |
          [ -f /tmp/published_epr_weekly.parquet ] || { echo "no published copy to compare against"; exit 0; }
          cat > /tmp/compare_epr.R <<'EOF'
          suppressMessages(library(data.table))
          cols <- c("player_id", "player_name", "snapshot_date", "epr", "epr_offensive", "epr_defensive", "wt_games")
          rd <- function(p) { d <- as.data.table(arrow::read_parquet(p, col_select = tidyselect::any_of(cols)))
                              d[, snapshot_date := as.Date(snapshot_date)]; d[snapshot_date == max(snapshot_date)] }
          pub <- rd("/tmp/published_epr_weekly.parquet")
          new <- rd("../pannadata/data/opta/opta_epr_weekly.parquet")
          cat(sprintf("latest snapshot: new %s (%d players) | published %s (%d players)\n",
                      max(new$snapshot_date), nrow(new), max(pub$snapshot_date), nrow(pub)))
          m <- merge(new, pub[, .(player_id, pub_epr = epr, pub_off = epr_offensive, pub_def = epr_defensive)], by = "player_id")
          m <- m[wt_games >= 20]
          cat(sprintf("players in both with 20+ weighted games: %d\n", nrow(m)))
          cat(sprintf("rank Spearman new vs published: EPR %.3f, offence %.3f, defence %.3f\n",
                      cor(m$epr, m$pub_epr, method = "spearman"), cor(m$epr_offensive, m$pub_off, method = "spearman"),
                      cor(m$epr_defensive, m$pub_def, method = "spearman")))
          m[, `:=`(rank = frank(-epr, ties.method = "min"), pub_rank = frank(-pub_epr, ties.method = "min"))]
          cat("\nTop 20 (20+ weighted games), new build vs published. EPR is rated goal value per 90 on the Big-5 scale; higher is better:\n")
          print(m[order(rank)][1:20, .(player_name, rank, pub_rank, epr = round(epr, 3), pub_epr = round(pub_epr, 3))])
          cat("\nBiggest risers and fallers among the published top 200 (move = published rank - new rank):\n")
          t <- m[pub_rank <= 200][, move := pub_rank - rank]
          print(rbind(t[order(-move)][1:8], t[order(move)][1:8])[, .(player_name, rank, pub_rank, move)])
          EOF
          set -o pipefail
          Rscript /tmp/compare_epr.R | tee -a "$GITHUB_STEP_SUMMARY"

      # Keep the build so two dry runs (a rebuild and its control) can be
      # compared with each other, not only with the published file.
      # upload-artifact refuses a path outside the workspace (../pannadata), so
      # copy the build in first.
      - name: Stage the EPR build (branch runs)
        if: env.PANNA_PUBLISH_DISABLED == 'true'
        run: cp ../pannadata/data/opta/opta_epr_weekly.parquet epr_weekly_branch_run.parquet

      - name: Keep the EPR build as an artifact (branch runs)
        if: env.PANNA_PUBLISH_DISABLED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: epr-weekly-branch-run
          path: epr_weekly_branch_run.parquet
          if-no-files-found: warn
          retention-days: 14

      - name: Snapshot summary
        if: always()
        run: |
          echo "## Weekly EPR Snapshot" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** ${{ inputs.force_full_rebuild == true && 'full rebuild' || 'incremental' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          OUT="../pannadata/data/opta/opta_epr_weekly.parquet"
          if [ -f "$OUT" ]; then
            echo "**Output:** opta_epr_weekly.parquet ($(ls -lh "$OUT" | awk '{print $5}'))" >> $GITHUB_STEP_SUMMARY
            if [ "$PANNA_PUBLISH_DISABLED" = "true" ]; then
              echo "**Upload:** NOT uploaded (publishing disabled on this ref)" >> $GITHUB_STEP_SUMMARY
            else
              echo "**Upload:** published by build_epr_weekly.R via vb_publish to opta-latest (a failed publish fails the build step)" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "**Status:** FAILED (no output parquet)" >> $GITHUB_STEP_SUMMARY
          fi
