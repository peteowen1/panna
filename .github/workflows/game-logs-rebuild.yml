name: Game Logs Rebuild (dry)

# Rebuilds game_logs_<season>.parquet for chosen seasons, one job per season,
# and keeps each as a run ARTIFACT. Never uploads to any release: publishing
# rebuilt game logs to blog-latest is a separate, deliberate step. Built for the
# EPV role8 centring gate (pannaverse docs/reference/POSITION-TAXONOMY.md
# section 6): rebuild every season with `epv_position_grouping = role8`, then
# build EPR from the artifacts and compare with the published EPR.

on:
  # A dispatch-only workflow can't be run until it is on main, so a push to this
  # branch runs it with the defaults (every season, role8) before then.
  push:
    branches: [exp/game-logs-rebuild]
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Space-separated season labels (blank = every season on blog-latest)'
        type: string
        required: false
        default: ''
      epv_position_grouping:
        description: 'EPV position centring: start_label (today) or role8'
        type: choice
        options: [role8, start_label]
        default: role8
      max_parallel:
        description: 'Seasons built at once'
        type: number
        default: 6

concurrency:
  group: game-logs-rebuild-${{ github.ref }}
  cancel-in-progress: false

env:
  GITHUB_PAT: ${{ secrets.WORKFLOW_PAT }}
  R_KEEP_PKG_SOURCE: yes
  # Belt and braces: 10b's own upload is also forced off below.
  PANNA_PUBLISH_DISABLED: 'true'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      seasons: ${{ steps.list.outputs.seasons }}
    steps:
      - name: List seasons
        id: list
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          INPUT_SEASONS: ${{ inputs.seasons || '' }}
        run: |
          if [ -n "$INPUT_SEASONS" ]; then
            s="$INPUT_SEASONS"
          else
            # Every season blog-latest already publishes, so the rebuild covers
            # exactly what EPR reads today.
            s=$(gh release view blog-latest --repo peteowen1/pannadata --json assets \
                  --jq '[.assets[].name | select(test("^game_logs_[0-9]{4}-[0-9]{4}[.]parquet$")) | sub("^game_logs_"; "") | sub("[.]parquet$"; "")] | sort | join(" ")')
          fi
          [ -n "$s" ] || { echo "FATAL: no seasons to build"; exit 1; }
          json=$(printf '%s\n' $s | jq -R . | jq -cs .)
          echo "Seasons: $json"
          echo "seasons=$json" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel || '6') }}
      matrix:
        season: ${{ fromJSON(needs.plan.outputs.seasons) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
          use-public-rspm: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 2
          extra-packages: |
            any::devtools
            any::callr
            any::piggyback
            any::arrow
            any::dplyr
            any::tidyr
            any::glmnet
            any::xgboost
            any::Matrix
            any::data.table
            any::DBI
            any::duckdb
            any::cli
          needs: |
            devtools

      # Same consolidated files the predictions pipeline downloads (10b loads
      # per-league events and lineups through load_opta_*() itself).
      - name: Download consolidated Opta data
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          OPTA_DIR="${{ runner.temp }}/pannadata/opta"
          mkdir -p "$OPTA_DIR"
          for f in opta_player_stats.parquet opta_shots.parquet opta_shot_events.parquet \
                   opta_events.parquet opta_lineups.parquet opta_fixtures.parquet \
                   opta_skills.parquet opta_match_stats.parquet opta_xmetrics.parquet \
                   opta_match_xg.parquet opta-catalog.json; do
            gh release download opta-latest --repo peteowen1/pannadata --pattern "$f" --dir "$OPTA_DIR" \
              && echo "  Downloaded $f" || echo "  Skipped $f (not found)"
          done
          for f in opta_lineups.parquet opta_fixtures.parquet opta_player_stats.parquet opta-catalog.json; do
            [ -f "$OPTA_DIR/$f" ] || { echo "FATAL: required $f missing"; exit 1; }
          done

      - name: Download skill caches
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          mkdir -p data-raw/cache-skills data-raw/cache-opta
          # 06 is required (10b's seasonal SPM); the league offsets feed the
          # game-logs PSV league offset.
          for f in 06_seasonal_ratings.rds psr_league_offsets.parquet; do
            gh release download predictions-cache --repo peteowen1/pannadata --pattern "$f" --dir data-raw/cache-skills \
              || { echo "FATAL: required cache $f missing"; exit 1; }
          done
          for f in 02b_decay_params.rds 03_skill_spm.rds; do
            gh release download predictions-cache --repo peteowen1/pannadata --pattern "$f" --dir data-raw/cache-skills \
              || echo "  WARNING: optional $f not found"
          done

      # 10b reads cache-skills/01_match_stats.rds for PSV. Own R process, as in
      # the predictions pipeline.
      - name: Rebuild match stats (skills step 01)
        env:
          PANNADATA_DIR: ${{ runner.temp }}/pannadata
        run: |
          cat > /tmp/run_step01.R << 'EOF'
          pannadata_path <- Sys.getenv("PANNADATA_DIR")
          devtools::load_all()
          pannadata_dir(pannadata_path)
          opta_data_dir(file.path(pannadata_path, "opta"))
          run_steps <- list(
            step_01_compute_match_stats = TRUE, step_02_estimate_skills = FALSE,
            step_02b_optimize_params = FALSE, step_03_skill_spm = FALSE,
            step_04_skill_xrapm = FALSE, step_05_skill_panna_ratings = FALSE,
            step_06_seasonal_skill_ratings = FALSE, step_07_train_psr_model = FALSE,
            step_08_export_skills = FALSE, step_08b_export_psr_weekly = FALSE,
            step_09_career_panna = FALSE)
          source("data-raw/estimated-skills/run_skills_pipeline.R")
          EOF
          Rscript /tmp/run_step01.R
          test -f data-raw/cache-skills/01_match_stats.rds || { echo "FATAL: step 01 wrote no 01_match_stats.rds"; exit 1; }

      - name: Build game logs for ${{ matrix.season }}
        env:
          PANNADATA_DIR: ${{ runner.temp }}/pannadata
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          XMETRICS_SOURCE: remote
          SEASON: ${{ matrix.season }}
          EPV_POSITION_GROUPING: ${{ inputs.epv_position_grouping || 'role8' }}
        run: |
          cat > /tmp/run_10b.R << 'EOF'
          pannadata_path <- Sys.getenv("PANNADATA_DIR")
          devtools::load_all()
          pannadata_dir(pannadata_path)
          opta_data_dir(file.path(pannadata_path, "opta"))
          cache_dir <- file.path("data-raw", "cache-predictions-opta")
          dir.create(cache_dir, recursive = TRUE, showWarnings = FALSE)
          game_log_seasons <- Sys.getenv("SEASON")
          epv_position_grouping <- Sys.getenv("EPV_POSITION_GROUPING")
          use_skill_ratings <- TRUE
          upload_game_logs <- FALSE
          mirror_alias <- FALSE
          t0 <- Sys.time()
          source("data-raw/match-predictions-opta/10b_export_game_logs.R")
          out <- file.path(cache_dir, sprintf("game_logs_%s.parquet", game_log_seasons))
          if (!file.exists(out)) stop("10b wrote no ", out)
          gl <- arrow::read_parquet(out)
          cat(sprintf("GAME_LOGS %s: %d rows, %d matches, %d leagues, %.1f min, EPV centring %s\n",
                      game_log_seasons, nrow(gl), length(unique(gl$match_id)), length(unique(gl$league)),
                      as.numeric(Sys.time() - t0, units = "mins"), epv_position_grouping))
          EOF
          Rscript /tmp/run_10b.R 2>&1 | tee /tmp/10b.log
          grep -E "^GAME_LOGS|centred by player-match role8|EPV adjustments skipped" /tmp/10b.log >> "$GITHUB_STEP_SUMMARY" || true

      - name: Keep the game logs as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: game-logs-${{ matrix.season }}
          path: data-raw/cache-predictions-opta/game_logs_${{ matrix.season }}.parquet
          if-no-files-found: error
          retention-days: 14
