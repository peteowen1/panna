on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

concurrency:
  group: r-cmd-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest

    name: ubuntu-latest (R release)

    env:
      GITHUB_PAT: ${{ secrets.WORKFLOW_PAT }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            peteowen1/pannamodels
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          # Fail only on R CMD check ERRORs, not WARNINGs. The suite is green
          # (7259 pass / 0 fail); the ~123 "warnings" are benign test-fixture
          # noise (e.g. aggregate_opta_stats "column not found, defaulting to 0"
          # on synthetic data) + upstream deprecations (xgboost reshape). A real
          # ERROR (incl. a deprecation that becomes an error) still fails the run.
          error-on: '"error"'
