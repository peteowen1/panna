on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

concurrency:
  group: r-cmd-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest

    name: ubuntu-latest (R release)

    env:
      GITHUB_PAT: ${{ secrets.WORKFLOW_PAT }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            peteowen1/pannamodels
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          # Fail only on R CMD check ERRORs, not WARNINGs. The suite is green
          # (7259 pass / 0 fail); the ~123 "warnings" are benign test-fixture
          # noise (e.g. aggregate_opta_stats "column not found, defaulting to 0"
          # on synthetic data) + upstream deprecations (xgboost reshape). A real
          # ERROR (incl. a deprecation that becomes an error) still fails the run.
          error-on: '"error"'

  # R CMD check runs on the built tarball, and .Rbuildignore excludes data-raw/
  # and .github/. The tests that guard publishing and the pipeline scripts
  # (test-publish-gating, test-workflow-r-payloads, test-sourced-script-return,
  # test-wc2026-export, ...) read those paths, so inside the check they skip
  # silently. This job runs the same suite from the source tree, where they
  # exist, with yaml and arrow installed so they do not skip for that reason
  # either. Make it a required status check in branch protection.
  source-tests:
    runs-on: ubuntu-latest

    name: testthat from source tree

    env:
      GITHUB_PAT: ${{ secrets.WORKFLOW_PAT }}

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            any::yaml
            any::arrow
            peteowen1/pannamodels
          needs: check

      - name: Run full testthat suite from source
        shell: Rscript {0}
        run: |
          res <- as.data.frame(devtools::test(stop_on_failure = FALSE, reporter = "summary"))
          message("passed=", sum(res$passed), " failed=", sum(res$failed),
                  " errors=", sum(res$error), " skipped=", sum(res$skipped))
          if (sum(res$failed) > 0 || any(res$error)) quit(status = 1)
