name: EPV/WPA Model Training

on:
  schedule:
    # Weekly Sunday 18:00 UTC. Refreshes opta_xmetrics.parquet (which the
    # Opta RAPM/SPM Pipeline's freshness gate depends on) by scoring with the
    # currently PUBLISHED models — xmetrics_only, no retrain (see the
    # XMETRICS_ONLY env comment; the retrain never fit the 120-min timeout).
    # `inputs.*` are empty on schedule events, so the env block below
    # supplies explicit defaults.
    - cron: '0 18 * * 0'
  workflow_dispatch:
    inputs:
      train_wp:
        description: 'Also train WP model (steps 05-06)'
        type: boolean
        default: false
      publish_wp:
        description: 'Publish trained WP model to pannamodels epv release (the store predictions reads). REVIEW the model first — default off.'
        type: boolean
        default: false
      wp_only:
        description: 'Train ONLY the WP model — skip the EPV/xMetrics retrain. Much faster (~20min vs ~120). The WP model does not consume EPV, so this is lossless for a WP retrain. Implies train_wp.'
        type: boolean
        default: false
      xmetrics_only:
        description: 'Skip the EPV/xG/xPass model retrain — just (re)calculate + export xMetrics (steps 03/04/04b) using the CURRENTLY PUBLISHED models. Much faster than a full retrain (no ~120min training) and scores against the reviewed/live model instead of an untested fresh one. Implies export_xmetrics=true.'
        type: boolean
        default: false
      export_xmetrics:
        description: 'Export xMetrics parquets (steps 03-04)'
        type: boolean
        default: true

env:
  GITHUB_PAT: ${{ secrets.WORKFLOW_PAT }}
  R_KEEP_PKG_SOURCE: yes
  # Coerce inputs (boolean on workflow_dispatch, empty on schedule) to a
  # string we can compare uniformly. Schedule defaults: export xmetrics,
  # don't retrain WP.
  # wp_only short-circuits the EPV/xMetrics retrain. The WP model is built from
  # raw possession chains (create_wp_features takes no EPV input — see
  # R/wp_model.R), so retraining EPV/xg/xpass to reach the WP step is pure waste
  # AND now pushes the combined job past the 120-min timeout. wp_only skips
  # steps 01/03/04 and runs only WP train + upload (~20 min total).
  WP_ONLY: ${{ inputs.wp_only == true && 'true' || 'false' }}
  # xmetrics_only skips step 01 (retrain) but still runs 03/04/04b — those
  # scripts' loaders (load_xg_model() etc.) default to the PUBLISHED model via
  # pannamodels when no fresh local training just happened, so this scores
  # against the reviewed/live model, not an unvetted retrain (panna#126 — found
  # while populating opta_xmetrics_bymatch.parquet for the first time without
  # paying for a full ~120min retrain just to get xMetrics refreshed).
  # Scheduled runs are xmetrics_only BY DESIGN: the weekly job's operational
  # product is a fresh opta_xmetrics.parquet (the Opta RAPM pipeline's
  # freshness gate depends on it), and it should score against the REVIEWED
  # published models, not an unattended fresh retrain. The full retrain +
  # export never fit the 120-min timeout anyway — every scheduled run from
  # 2026-06-15 to 07-05 was timeout-cancelled mid step 03, which silently
  # starved the RAPM gate (26-day-old xmetrics by 07-07). Retrains remain
  # manual-dispatch.
  XMETRICS_ONLY: ${{ (inputs.xmetrics_only == true || github.event_name == 'schedule') && 'true' || 'false' }}
  # wp_only/xmetrics_only force the EPV/xMetrics retrain steps off regardless
  # of their own inputs; xmetrics_only forces xMetrics export ON.
  EXPORT_XMETRICS: ${{ (inputs.export_xmetrics == true || inputs.xmetrics_only == true || github.event_name == 'schedule') && inputs.wp_only != true && 'true' || 'false' }}
  # wp_only implies train_wp (no point skipping EPV if you don't train WP).
  TRAIN_WP: ${{ (inputs.train_wp == true || inputs.wp_only == true) && 'true' || 'false' }}
  # Gated publish: the trained WP model is ALWAYS staged to the pannadata
  # `models` release, but only promoted to the pannamodels `epv` release (the
  # store load_wp_model() / the predictions pipeline actually read) when this
  # is explicitly set. This is the "review before pannamodels upload" gate —
  # never true on schedule.
  PUBLISH_WP: ${{ inputs.publish_wp == true && 'true' || 'false' }}

jobs:
  epv-pipeline:
    runs-on: ubuntu-latest
    # Per-chunk feature generation + xgboost training fits in ~75-90 min on a
    # 7GB runner; bumped from 90 to 120 to give headroom on slower runners.
    timeout-minutes: 120

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
          use-public-rspm: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1
          extra-packages: |
            any::devtools
            any::piggyback
            any::arrow
            any::dplyr
            any::xgboost
            any::data.table
            any::DBI
            any::duckdb
            any::cli
          needs: |
            devtools

      - name: Download Opta event data
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          OPTA_DIR="${{ runner.temp }}/pannadata/opta"
          mkdir -p "$OPTA_DIR"

          echo "Downloading Opta files for EPV training..."
          MISSING=0
          for f in opta_lineups.parquet opta_fixtures.parquet opta_shot_events.parquet \
                   opta-catalog.json; do
            if gh release download opta-latest --repo peteowen1/pannadata --pattern "$f" --dir "$OPTA_DIR"; then
              echo "  Downloaded $f"
            else
              echo "::error::Failed to download $f from opta-latest"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            echo "::error::$MISSING required file(s) failed to download. Aborting."
            exit 1
          fi

          # Per-league event files (match_events are too large for single consolidated file)
          echo ""
          echo "Downloading per-league event files..."
          EVENT_COUNT=0
          for f in $(gh release view opta-latest --repo peteowen1/pannadata --json assets -q '.assets[].name' | grep 'events_'); do
            EVENTS_DIR="$OPTA_DIR/events_consolidated"
            mkdir -p "$EVENTS_DIR"
            if gh release download opta-latest --repo peteowen1/pannadata --pattern "$f" --dir "$EVENTS_DIR"; then
              echo "  Downloaded $f"
              EVENT_COUNT=$((EVENT_COUNT + 1))
            else
              echo "::warning::Failed to download event file $f"
            fi
          done
          echo "Downloaded $EVENT_COUNT event files"

          echo ""
          echo "Opta data:"
          ls -lh "$OPTA_DIR"
          if [ -d "$OPTA_DIR/events_consolidated" ]; then
            echo "Event files:"
            ls -lh "$OPTA_DIR/events_consolidated/"
          fi

      - name: Train EPV models
        if: ${{ env.WP_ONLY != 'true' && env.XMETRICS_ONLY != 'true' }}
        env:
          PANNADATA_DIR: ${{ runner.temp }}/pannadata
        run: |
          Rscript -e "
            pannadata_path <- Sys.getenv('PANNADATA_DIR', '../pannadata/data')
            opta_path <- file.path(pannadata_path, 'opta')
            cat('Opta data dir:', opta_path, '\n')

            devtools::load_all()
            pannadata_dir(pannadata_path)
            opta_data_dir(opta_path)

            source('data-raw/epv/01_train_epv_models.R')
          "

      - name: Upload models (immediately after training)
        # Publish the freshly-trained models right after training so a slow or
        # cancelled xMetrics step (below) can never skip publishing — that
        # fragility left xgot_model unpublished on 2026-06-16. The final
        # "Upload trained models" step re-uploads (--clobber, idempotent) and
        # handles the WP model.
        if: ${{ env.WP_ONLY != 'true' && env.XMETRICS_ONLY != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          set -euo pipefail
          CACHE_DIR="data-raw/cache/epv"
          for f in xg_model.rds xgot_model.rds xpass_model.rds epv_model.rds; do
            if [ -f "$CACHE_DIR/$f" ]; then
              gh release upload models "$CACHE_DIR/$f" --repo peteowen1/pannadata --clobber \
                && echo "  Uploaded $f (early)"
            fi
          done

      - name: Calculate player xMetrics
        if: ${{ env.EXPORT_XMETRICS == 'true' }}
        env:
          PANNADATA_DIR: ${{ runner.temp }}/pannadata
        run: |
          Rscript -e "
            pannadata_path <- Sys.getenv('PANNADATA_DIR', '../pannadata/data')
            opta_path <- file.path(pannadata_path, 'opta')

            devtools::load_all()
            pannadata_dir(pannadata_path)
            opta_data_dir(opta_path)

            source('data-raw/epv/03_calculate_player_xmetrics.R')
            source('data-raw/epv/04_export_xmetrics.R')
            # panna#126: consolidate + upload the per-match artifact too, so
            # GHA weekly/game-logs runs can enrich_match_stats_with_xmetrics(
            # source = 'remote') instead of silently building xG-blind
            # snapshots (they have no local xmetrics_bymatch/ tree).
            source('data-raw/epv/04b_export_xmetrics_bymatch.R')
          "

          # Fail here if the export silently no-op'd. Without this guard,
          # Opta RAPM/SPM Pipeline blows up later with a confusing error
          # far from the cause.
          XMETRICS_FILE=data-raw/cache/epv/opta_xmetrics.parquet
          if [ ! -f "$XMETRICS_FILE" ]; then
            echo "::error::EXPORT_XMETRICS=true but $XMETRICS_FILE was not produced"
            exit 1
          fi
          echo "✓ $XMETRICS_FILE produced ($(stat -c%s "$XMETRICS_FILE") bytes)"

          XMETRICS_BYMATCH_FILE=data-raw/cache/epv/opta_xmetrics_bymatch.parquet
          if [ ! -f "$XMETRICS_BYMATCH_FILE" ]; then
            echo "::error::EXPORT_XMETRICS=true but $XMETRICS_BYMATCH_FILE was not produced"
            exit 1
          fi
          echo "✓ $XMETRICS_BYMATCH_FILE produced ($(stat -c%s "$XMETRICS_BYMATCH_FILE") bytes)"

      - name: Train WP model
        if: ${{ env.TRAIN_WP == 'true' }}
        env:
          PANNADATA_DIR: ${{ runner.temp }}/pannadata
        run: |
          Rscript -e "
            pannadata_path <- Sys.getenv('PANNADATA_DIR', '../pannadata/data')
            opta_path <- file.path(pannadata_path, 'opta')

            devtools::load_all()
            pannadata_dir(pannadata_path)
            opta_data_dir(opta_path)

            source('data-raw/epv/05_train_wp_model.R')
          "

      - name: Upload trained models
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          set -euo pipefail
          echo "Uploading trained models to models release..."
          CACHE_DIR="data-raw/cache/epv"
          UPLOADED=0

          # In wp_only/xmetrics_only mode the EPV/xg/xpass models are not
          # retrained (step 01 was skipped), so they won't be in CACHE_DIR and
          # must not be uploaded or counted — the WP block below (wp_only) or
          # the xMetrics export step (xmetrics_only) already handled the
          # actual output for those modes.
          if [ "$WP_ONLY" != "true" ] && [ "$XMETRICS_ONLY" != "true" ]; then
            for f in xg_model.rds xgot_model.rds xpass_model.rds epv_model.rds; do
              if [ -f "$CACHE_DIR/$f" ]; then
                if gh release upload models "$CACHE_DIR/$f" --repo peteowen1/pannadata --clobber; then
                  echo "  Uploaded $f"
                  UPLOADED=$((UPLOADED + 1))
                else
                  echo "::error::Failed to upload $f to models release (does the release exist?)"
                  exit 1
                fi
              else
                echo "::warning::Model file $f not found in $CACHE_DIR"
              fi
            done
            if [ "$UPLOADED" -eq 0 ]; then
              echo "::error::No model files were produced. Training may have failed."
              exit 1
            fi
          else
            echo "wp_only/xmetrics_only mode — skipping xg/xpass/epv upload (not retrained)."
          fi

          if [ "$TRAIN_WP" = "true" ]; then
            # 05_train_wp_model.R saves via save_wp_model() to
            # opta_data_dir()/models — NOT $CACHE_DIR like the xg/epv/xpass
            # models. opta_data_dir() resolved to $PANNADATA_DIR/opta on the
            # runner, so the WP model lands here. (A prior version of this step
            # looked in $CACHE_DIR and silently skipped the upload every run —
            # the model trained but never shipped.)
            WP_MODEL="${{ runner.temp }}/pannadata/opta/models/wp_model.rds"
            if [ ! -f "$WP_MODEL" ]; then
              echo "::error::TRAIN_WP=true but no wp_model.rds at $WP_MODEL — training did not save the model."
              exit 1
            fi

            # Stage to pannadata `models` (parity with the other models; NOT the
            # store the predictions pipeline reads).
            if gh release upload models "$WP_MODEL" --repo peteowen1/pannadata --clobber; then
              echo "  Staged wp_model.rds -> pannadata/models"
            else
              echo "::error::Failed to upload wp_model.rds to pannadata models release"
              exit 1
            fi

            # PROMOTE to pannamodels `epv` — the release load_wp_model() pulls
            # from (via the pannamodels package) and therefore what the
            # predictions pipeline + blog actually consume. Gated on PUBLISH_WP
            # so a retrain alone never overwrites the live model without review.
            if [ "$PUBLISH_WP" = "true" ]; then
              # versebus manifest-last publish (ECOSYSTEM-FIX-PLAN.md WIRING A /
              # §1 pattern): a bare --clobber upload here is a non-atomic write
              # with no commit record -- pannamodels' consumer-side sha check
              # (R/load_model.R .get_bus_manifest(), landed in M5) can only
              # verify freshness if bus_manifest.json actually reflects what's
              # on the release. Gate: upload -> verify (size vs the live asset
              # list) -> bus_manifest.json LAST, carrying forward any other
              # assets already committed on this tag (xg/xgot/xpass/epv/duel
              # models published outside this workflow are left as
              # uncommitted-but-present if this is the tag's first manifest --
              # legacy mode covers them, per §1.2). set -euo pipefail (top of
              # this step) means any failure here aborts BEFORE the manifest
              # upload, so consumers keep seeing the last consistent snapshot.
              EPV_REPO="peteowen1/pannamodels"
              EPV_TAG="epv"

              if gh release upload "$EPV_TAG" "$WP_MODEL" --repo "$EPV_REPO" --clobber; then
                echo "  Published wp_model.rds -> pannamodels/epv (LIVE store)"
              else
                echo "::error::Failed to publish wp_model.rds to pannamodels epv release"
                exit 1
              fi

              WP_BYTES=$(stat -c%s "$WP_MODEL")
              LIVE_BYTES=$(gh release view "$EPV_TAG" --repo "$EPV_REPO" --json assets \
                --jq '.assets[] | select(.name=="wp_model.rds") | .size')
              if [ "$LIVE_BYTES" != "$WP_BYTES" ]; then
                echo "::error::Post-upload verify failed: wp_model.rds live size $LIVE_BYTES != local $WP_BYTES"
                exit 1
              fi

              WP_SHA=$(sha256sum "$WP_MODEL" | cut -d' ' -f1)
              MANIFEST_TMP=$(mktemp -d)
              if gh release download "$EPV_TAG" --repo "$EPV_REPO" \
                   --pattern "bus_manifest.json" --dir "$MANIFEST_TMP" 2>/dev/null; then
                PREV_MANIFEST="$MANIFEST_TMP/bus_manifest.json"
              else
                PREV_MANIFEST=""
              fi

              GENERATION="$(date -u +%Y%m%dT%H%M%SZ)-r${{ github.run_id }}"
              PRODUCED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              NEW_ENTRY=$(jq -n --arg name "wp_model.rds" --arg sha "$WP_SHA" \
                --argjson bytes "$WP_BYTES" \
                '{name: $name, sha256: $sha, bytes: $bytes, rows: null}')

              if [ -n "$PREV_MANIFEST" ] && [ -f "$PREV_MANIFEST" ]; then
                MERGED_ASSETS=$(jq --argjson new "$NEW_ENTRY" \
                  '[.assets[] | select(.name != "wp_model.rds")] + [$new]' \
                  "$PREV_MANIFEST")
              else
                MERGED_ASSETS=$(jq -n --argjson new "$NEW_ENTRY" '[$new]')
              fi

              jq -n --arg tag "$EPV_TAG" --arg gen "$GENERATION" --arg produced "$PRODUCED_AT" \
                --arg repo "peteowen1/panna" --arg workflow "epv-pipeline.yml" \
                --arg run_id "${{ github.run_id }}" --arg run_attempt "${{ github.run_attempt }}" \
                --argjson assets "$MERGED_ASSETS" \
                '{schema_version: 1, tag: $tag, generation: $gen, produced_at_utc: $produced,
                  producer: {repo: $repo, workflow: $workflow, run_id: $run_id, run_attempt: $run_attempt},
                  assets: $assets, notes: ""}' > "$MANIFEST_TMP/bus_manifest.json"

              if gh release upload "$EPV_TAG" "$MANIFEST_TMP/bus_manifest.json" --repo "$EPV_REPO" --clobber; then
                echo "  Updated bus_manifest.json on pannamodels/epv (generation $GENERATION)"
              else
                echo "::error::Failed to upload bus_manifest.json to pannamodels epv release"
                exit 1
              fi
            else
              echo "::notice::PUBLISH_WP=false — wp_model.rds staged to pannadata/models only."
              echo "::notice::Predictions still read the OLD model from pannamodels/epv until you re-run with publish_wp=true."
            fi
          fi

          # xmetrics upload is handled by data-raw/epv/04_export_xmetrics.R
          # via piggyback; do not re-add here.

          echo ""
          echo "=== EPV Pipeline Complete ==="
