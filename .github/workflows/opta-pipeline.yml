name: Opta RAPM/SPM Pipeline

on:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force full rebuild from step 1'
        type: boolean
        default: false
      force_rebuild_from:
        description: 'Force rebuild from step N (1-9, blank = use cache)'
        type: number
        required: false
      upload_caches:
        description: 'Upload caches to predictions-cache release when done'
        type: boolean
        default: true
      start_step:
        description: 'Start from step N (1-9). Downloads intermediate caches from predictions-cache release. Default 1 = full run.'
        type: number
        required: false
  # repository_dispatch trigger removed 2026-06-11 (panna#87): the pipeline
  # OOMs the 16GB hosted runner deterministically since the 4-league
  # expansion, so the daily opta-scrape-complete dispatch burned ~1-3
  # runner-hours per day on guaranteed failures. Manual-only until the
  # memory profile fits 16GB again (or the job moves to a larger runner).
  # repository_dispatch:
  #   types: [opta-scrape-complete]

env:
  GITHUB_PAT: ${{ secrets.WORKFLOW_PAT }}
  R_KEEP_PKG_SOURCE: yes
  # panna#87 OOM mitigation (option A): skip cv.glmnet in steps 04/06 and fit at
  # the closed-form lambda = 16.67 * n_obs^-0.58. CV does 11 dense refits per call
  # (10 folds + final); the back-to-back RAPM/xRAPM fits are what OOM the 16GB
  # runner. We keep the free ubuntu-latest runner (runs-on unchanged) and rely on
  # this flag instead. Any non-empty value enables it.
  OPTA_FIXED_LAMBDA: '1'

jobs:
  opta-pipeline:
    runs-on: ubuntu-latest
    # Bumped from 60 to 120 because step 01 now builds SPADL on-the-fly from
    # raw events (~35 min for ~51K matches × 15 leagues). Previous 60-min
    # cap killed step 03 with steps 04-09 still to run. Empirical breakdown:
    # setup 3min + step01 35min + step02 4min + step03 8min + step04 ~12min
    # + steps05-09 ~10min ≈ 72 min.
    # 2026-06: bumped 120 -> 350 for the new-league integration — ~10 extra comps
    # (MLS/Liga MX/Argentina/Saudi + 6 bridges) added ~28K matches (~+55%), so
    # step 01 SPADL build + step 04 RAPM CV scale up substantially. 350 is under
    # GitHub's 360-min hosted-runner hard cap.
    timeout-minutes: 350

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify opta_xmetrics freshness
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          INPUT_START_STEP: ${{ inputs.start_step }}
        run: |
          set -euo pipefail
          # opta_xmetrics.parquet is owned by the EPV/WPA Model Training
          # workflow. If it's stale, the join step downstream produces zero xG
          # for every splint, which the RAPM filter then strips — aborting
          # with a confusing "0 splints" message far from the cause. Fail
          # loudly here before any heavy work, unless we're resuming past the
          # join step (xmetrics already baked into the cached
          # 02_processed_data.rds).
          if [[ "$INPUT_START_STEP" =~ ^[0-9]+$ ]] && [ "$INPUT_START_STEP" -gt 2 ]; then
            echo "Skipping xmetrics freshness check: start_step=$INPUT_START_STEP (>2)"
            exit 0
          fi
          if ! UPDATED=$(gh api repos/peteowen1/pannadata/releases/tags/opta-latest \
            --jq '[.assets[] | select(.name == "opta_xmetrics.parquet") | .updated_at] | first'); then
            echo "::error::Failed to query opta-latest release metadata via gh api."
            exit 1
          fi
          if [ -z "$UPDATED" ] || [ "$UPDATED" = "null" ]; then
            echo "::error::opta_xmetrics.parquet not found on opta-latest release."
            echo "::error::Run the EPV/WPA Model Training workflow with export_xmetrics=true."
            exit 1
          fi
          NOW=$(date -u +%s)
          if ! ASSET_TS=$(date -u -d "$UPDATED" +%s 2>/dev/null) || [ -z "$ASSET_TS" ]; then
            echo "::error::Could not parse opta_xmetrics.parquet timestamp: '$UPDATED'."
            exit 1
          fi
          AGE_DAYS=$(( (NOW - ASSET_TS) / 86400 ))
          echo "opta_xmetrics.parquet last updated $AGE_DAYS days ago ($UPDATED)"
          if [ "$AGE_DAYS" -gt 14 ]; then
            echo "::error::opta_xmetrics.parquet is $AGE_DAYS days old (>14d threshold)."
            echo "::error::Trigger the EPV/WPA Model Training workflow with export_xmetrics=true to refresh."
            exit 1
          fi

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
          use-public-rspm: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1
          extra-packages: |
            any::devtools
            any::callr
            any::piggyback
            any::arrow
            any::dplyr
            any::glmnet
            any::xgboost
            any::Matrix
            any::data.table
            any::DBI
            any::duckdb
            any::cli
          needs: |
            devtools

      - name: Download Opta data
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          OPTA_DIR="${{ runner.temp }}/pannadata/opta"
          MODELS_DIR="${{ runner.temp }}/pannadata/opta/models"
          mkdir -p "$OPTA_DIR" "$MODELS_DIR"

          echo "Downloading consolidated Opta files..."
          for f in opta_player_stats.parquet opta_shots.parquet opta_shot_events.parquet \
                   opta_events.parquet opta_lineups.parquet opta_fixtures.parquet \
                   opta_xmetrics.parquet opta-catalog.json; do
            if gh release download opta-latest --repo peteowen1/pannadata --pattern "$f" --dir "$OPTA_DIR" 2>/dev/null; then
              echo "  Downloaded $f"
            else
              echo "  Skipped $f (not found)"
            fi
          done

          echo ""
          echo "Downloading pre-trained models..."
          MODELS_DOWNLOADED=0
          for f in xg_model.rds xpass_model.rds epv_model.rds; do
            if gh release download models --repo peteowen1/pannadata --pattern "$f" --dir "$MODELS_DIR" 2>/dev/null; then
              echo "  Downloaded $f"
              MODELS_DOWNLOADED=$((MODELS_DOWNLOADED + 1))
            else
              echo "::warning::$f not found on models release"
            fi
          done
          if [ "$MODELS_DOWNLOADED" -lt 3 ]; then
            echo "::error::Only $MODELS_DOWNLOADED/3 pre-trained models downloaded. Run the EPV/WPA Model Training workflow first."
            exit 1
          fi

          echo ""
          echo "Opta data:"
          ls -lh "$OPTA_DIR"
          echo "Models:"
          ls -lh "$MODELS_DIR"

          # Validate required files
          MISSING=0
          for f in opta_lineups.parquet opta_player_stats.parquet opta-catalog.json; do
            if [ ! -f "$OPTA_DIR/$f" ]; then
              echo "FATAL: Required file $f was not downloaded"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            echo "ERROR: $MISSING required file(s) missing."
            exit 1
          fi

          # Log optional file status for pipeline summary
          OPTIONAL_MISSING=""
          for f in opta_events.parquet opta_xmetrics.parquet opta_shots.parquet opta_shot_events.parquet; do
            if [ ! -f "$OPTA_DIR/$f" ]; then
              OPTIONAL_MISSING="$OPTIONAL_MISSING $f"
            fi
          done
          if [ -n "$OPTIONAL_MISSING" ]; then
            echo "NOTE: Optional files not downloaded:$OPTIONAL_MISSING"
            echo "Pipeline will run but may produce degraded results."
          fi

      - name: Download intermediate caches (resume mode)
        if: inputs.start_step != '' && inputs.start_step != '1'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          INPUT_START_STEP: ${{ inputs.start_step }}
        run: |
          # Resume from step N requires caches from steps 1..(N-1) to be present.
          # Download whatever intermediate caches the predictions-cache release
          # has. The pipeline's own per-step cache check (file.exists +
          # mtime > prior step's mtime) decides whether to use them.
          CACHE_DIR="data-raw/cache-opta"
          mkdir -p "$CACHE_DIR"

          # Map step number -> cache files needed BEFORE that step runs.
          # Step N consumes step (N-1)'s output (and earlier).
          declare -a NEEDED=()
          if [ "$INPUT_START_STEP" -ge 2 ]; then NEEDED+=(01_raw_data.rds 01_config.rds); fi
          # panna#87: 02_opta_stats.rds (opta_stats/opta_xmetrics, split out
          # of 02_processed_data.rds so steps 5/7 never deserialize
          # lineups/shooting/results alongside it) is needed at the same
          # tier as 02_processed_data.rds -- both are step 2's output.
          if [ "$INPUT_START_STEP" -ge 3 ]; then NEEDED+=(02_processed_data.rds 02_opta_stats.rds); fi
          if [ "$INPUT_START_STEP" -ge 4 ]; then NEEDED+=(03_splints.rds); fi
          if [ "$INPUT_START_STEP" -ge 5 ]; then NEEDED+=(04_rapm.rds); fi
          if [ "$INPUT_START_STEP" -ge 6 ]; then NEEDED+=(05_spm.rds); fi
          if [ "$INPUT_START_STEP" -ge 7 ]; then NEEDED+=(06_xrapm.rds); fi
          if [ "$INPUT_START_STEP" -ge 8 ]; then NEEDED+=(07_seasonal_ratings.rds); fi
          if [ "$INPUT_START_STEP" -ge 9 ]; then NEEDED+=(08_panna.rds); fi

          echo "Resume mode: start_step=$INPUT_START_STEP, downloading ${#NEEDED[@]} cache files"
          MISSING=()
          for f in "${NEEDED[@]}"; do
            if gh release download predictions-cache --repo peteowen1/pannadata \
                 --pattern "$f" --dir "$CACHE_DIR" 2>/dev/null; then
              echo "  Downloaded $f"
            else
              echo "  MISSING $f (will need to be regenerated by an earlier step)"
              MISSING+=("$f")
            fi
          done

          if [ "${#MISSING[@]}" -gt 0 ]; then
            echo "ERROR: ${#MISSING[@]} required intermediate cache(s) missing: ${MISSING[*]}"
            echo "Either run the pipeline from an earlier step, or upload the missing caches."
            exit 1
          fi

          # Touch all downloaded files so their mtime matches each other and
          # the pipeline's per-step "is cache fresh?" check passes.
          touch "$CACHE_DIR"/*.rds
          ls -lh "$CACHE_DIR"

      - name: Run Opta RAPM/SPM pipeline
        env:
          PANNADATA_DIR: ${{ runner.temp }}/pannadata
          INPUT_FORCE_REBUILD: ${{ inputs.force_rebuild }}
          INPUT_FORCE_REBUILD_FROM: ${{ inputs.force_rebuild_from }}
          INPUT_START_STEP: ${{ inputs.start_step }}
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          HB_UPLOAD_CACHES: ${{ inputs.upload_caches }}
        run: |
          # --- memory tracer (diagnostic, no pipeline logic) -----------------
          # Sample RAM every 20s to the step log AND pipeline.log (so the
          # external heartbeat below can relay it). NB the 2026-07-07 OOM kill
          # was hard enough that GitHub never persisted the step log at all —
          # the step log alone is NOT a reliable flight recorder on this job.
          touch pipeline.log
          ( while true; do
              echo "[MEM] $(date -u +%H:%M:%S) $(free -m | awk '/^Mem:/{print "used="$3"MB avail="$7"MB total="$2"MB"}')" | tee -a pipeline.log
              sleep 20
            done ) &
          MEM_TRACER_PID=$!

          # --- external heartbeat (panna#87 flight recorder) ------------------
          # Stream progress somewhere that SURVIVES runner death: one
          # self-updating comment on issue #87 (memory + last step/RSS markers
          # + log tail, PATCHed every ~90s), and upload each completed step
          # cache to the predictions-cache release as it appears so a mid-step
          # kill still allows a start_step resume (the end-of-job upload step
          # never runs after a hard kill).
          HB_ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/87/comments" \
                  -f body="[#87 live heartbeat] run $GITHUB_RUN_ID initializing..." \
                  --jq .id 2>/dev/null || echo "")
          echo "Heartbeat comment id: ${HB_ID:-none}"
          ( CACHE_DIR="data-raw/cache-opta"
            declare -A SENT
            while true; do
              sleep 90
              {
                echo "**[#87 live heartbeat] run ${GITHUB_RUN_ID} — last update $(date -u +%H:%M:%S)Z** (comment self-updates while the run is alive; if this timestamp is stale and the run is dead, the lines below are the flight recorder)"
                echo '```'
                free -m | awk '/^Mem:/{print "MEM used="$3"MB avail="$7"MB total="$2"MB"}'
                echo '--- last step / RSS / MEM markers ---'
                grep -E "\[rss\]|\[MEM\]|Step [0-9]" pipeline.log | tail -10
                echo '--- raw log tail ---'
                tail -6 pipeline.log
                echo '```'
              } > hb_body.txt
              if [ -n "$HB_ID" ]; then
                gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$HB_ID" \
                  -f body="$(cat hb_body.txt)" >/dev/null 2>&1 || true
              fi
              # Upload completed step caches as they stabilize (size unchanged
              # across a 5s recheck = not mid-write).
              if [ "$HB_UPLOAD_CACHES" != "false" ] && [ -d "$CACHE_DIR" ]; then
                for f in "$CACHE_DIR"/0*.rds; do
                  [ -f "$f" ] || continue
                  base=$(basename "$f")
                  if [ -z "${SENT[$base]:-}" ]; then
                    sz=$(stat -c %s "$f"); sleep 5; sz2=$(stat -c %s "$f")
                    if [ "$sz" = "$sz2" ] && [ "$sz" -gt 0 ]; then
                      if gh release upload predictions-cache "$f" \
                           --repo peteowen1/pannadata --clobber >/dev/null 2>&1; then
                        SENT[$base]=1
                        echo "[HB] uploaded completed cache $base ($sz bytes)" | tee -a pipeline.log
                      fi
                    fi
                  fi
                done
              fi
            done ) &
          HB_PID=$!
          # -------------------------------------------------------------------

          RSCRIPT_EXIT=0
          Rscript -e "
            pannadata_path <- Sys.getenv('PANNADATA_DIR', '../pannadata/data')
            opta_path <- file.path(pannadata_path, 'opta')
            cat('PANNADATA_DIR:', pannadata_path, '\n')
            cat('Opta data dir:', opta_path, '\n')
            cat('Files:', length(list.files(opta_path)), '\n')

            devtools::load_all()
            pannadata_dir(pannadata_path)
            opta_data_dir(opta_path)

            # Config overrides (from env vars, not interpolated inputs)
            force_rebuild_input <- Sys.getenv('INPUT_FORCE_REBUILD', 'false')
            force_rebuild_from_input <- Sys.getenv('INPUT_FORCE_REBUILD_FROM', '')
            start_step_input <- Sys.getenv('INPUT_START_STEP', '')

            if (isTRUE(as.logical(force_rebuild_input))) {
              force_rebuild_from <- 1L
            } else if (nzchar(force_rebuild_from_input) && !is.na(as.numeric(force_rebuild_from_input))) {
              force_rebuild_from <- as.integer(force_rebuild_from_input)
            } else {
              force_rebuild_from <- NULL
            }

            if (nzchar(start_step_input) && !is.na(as.numeric(start_step_input))) {
              start_step <- as.integer(start_step_input)
              cat('Resume mode: start_step =', start_step, '\n')
            }

            source('data-raw/player-ratings-opta/run_pipeline_opta.R', chdir = FALSE)
            if (isTRUE(pipeline_failed)) quit(status = 1)
          " 2>&1 | tee -a pipeline.log
          RSCRIPT_EXIT=${PIPESTATUS[0]}

          kill "$MEM_TRACER_PID" "$HB_PID" 2>/dev/null || true
          # Final heartbeat update so the comment records the terminal state.
          if [ -n "$HB_ID" ]; then
            {
              echo "**[#87 heartbeat FINAL] run ${GITHUB_RUN_ID} — Rscript exited $RSCRIPT_EXIT at $(date -u +%H:%M:%S)Z**"
              echo '```'
              grep -E "\[rss\]|\[MEM\]|Step [0-9]" pipeline.log | tail -12
              tail -8 pipeline.log
              echo '```'
            } > hb_body.txt
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$HB_ID" \
              -f body="$(cat hb_body.txt)" >/dev/null 2>&1 || true
          fi
          exit "$RSCRIPT_EXIT"

      - name: Upload caches to predictions-cache release
        # if: always() — upload whatever step caches were produced even if
        # a later step failed. Lets us re-dispatch with start_step=N to skip
        # already-completed steps and iterate on the failing one in ~5 min
        # instead of 50+ min from scratch.
        if: always() && inputs.upload_caches != 'false'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          CACHE_DIR="data-raw/cache-opta"

          if [ ! -d "$CACHE_DIR" ]; then
            echo "No cache dir found — pipeline didn't make it past setup."
            exit 0
          fi

          echo "Uploading any per-step caches that were produced..."
          UPLOADED=0
          for f in 01_raw_data.rds 01_config.rds \
                   02_processed_data.rds 02_opta_stats.rds \
                   03_splints.rds \
                   04_rapm.rds 04_rapm_multi.rds \
                   05_spm.rds \
                   06_xrapm.rds \
                   07_seasonal_ratings.rds 07_seasonal_ratings.rds.meta.json \
                   08_panna.rds \
                   team_season_strength.parquet; do
            # team_season_strength.parquet is produced by sketch_team_strength.R
            # (not a numbered RAPM step), so it's only present on LOCAL runs where
            # the operator ran that script after the pipeline. The `-f` guard below
            # skips it on cloud runs where it's absent. It feeds opp_def_rating in
            # build_epr_weekly (epr-weekly-snapshot.yml downloads it from here).
            if [ -f "$CACHE_DIR/$f" ]; then
              gh release upload predictions-cache "$CACHE_DIR/$f" \
                --repo peteowen1/pannadata --clobber
              echo "  Uploaded $f"
              UPLOADED=$((UPLOADED + 1))
            fi
          done
          echo "Uploaded $UPLOADED cache file(s)."

      - name: Pipeline summary
        if: always()
        run: |
          echo "## Opta RAPM/SPM Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          CACHE_DIR="data-raw/cache-opta"
          if [ -f "$CACHE_DIR/07_seasonal_ratings.rds" ]; then
            echo "**Ratings:** generated successfully" >> $GITHUB_STEP_SUMMARY
            if [ "${{ inputs.upload_caches }}" != "false" ]; then
              echo "**Caches:** uploaded to \`predictions-cache\` release" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "**Status:** Pipeline FAILED (no ratings cache found)" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
