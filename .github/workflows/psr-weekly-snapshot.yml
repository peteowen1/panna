name: Weekly PSR Snapshot

# Builds opta_psr_weekly.parquet (~295 MB) for date-based player_psr() queries.
# Split out of predictions-pipeline.yml because runner-level OOM in this step
# was reddening Predictions Pipeline despite the predictions themselves succeeding.

on:
  schedule:
    # Wednesday 10 AM UTC — 2 hours after Predictions Pipeline cron
    - cron: '0 10 * * 3'
  workflow_dispatch:
    inputs:
      allow_subset_drop:
        description: 'Allow a live_subset league to drop from psv_live_constants.csv (tournament legitimately ended)'
        type: boolean
        default: false

concurrency:
  group: panna-release-writer
  cancel-in-progress: false

env:
  GITHUB_PAT: ${{ secrets.WORKFLOW_PAT }}
  R_KEEP_PKG_SOURCE: yes

jobs:
  psr-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 135

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
          use-public-rspm: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 2
          extra-packages: |
            any::devtools
            any::piggyback
            any::arrow
            any::dplyr
            any::tidyr
            any::data.table
            any::cli
          needs: |
            devtools

      # P5-C step 1 (versebus phase-5 plan): opta-latest fetches go through
      # vb_download() — atomic rename, parquet magic-byte check, sha256 verify
      # for manifest-committed assets, size check vs the asset listing
      # otherwise. VERSEBUS_STRICT=1 is deliberately NOT set yet: opta-latest's
      # bus_manifest.json currently commits only the daily scrape's own uploads
      # (11 of ~127 assets) — opta_match_stats / opta_skills / opta_xmetrics
      # are published by other pipelines via plain piggyback and strict mode
      # would refuse them as uncommitted. Flip strict here only once those
      # producers publish via vb_publish() (8b's own opta_psr_weekly upload
      # already does).
      # predictions-cache fetches (next step) stay on plain gh: that tag is
      # heartbeat-mutated mid-run by opta-pipeline and is EXEMPT from strict.
      - name: Download consolidated Opta data (versebus-verified)
        run: |
          cat > /tmp/vb_fetch_opta.R << 'EOF'
          devtools::load_all()
          opta_dir <- file.path(Sys.getenv("RUNNER_TEMP"), "pannadata", "opta")
          dir.create(opta_dir, recursive = TRUE, showWarnings = FALSE)
          repo <- "peteowen1/pannadata"; tag <- "opta-latest"
          # Manifest fetch is best-effort in non-strict mode: a transient API
          # error here must not kill the run before the per-file
          # required/optional handling below — files still get size-verified
          # against the asset listing without it (review catch).
          manifest <- tryCatch(vb_read_manifest(repo, tag, required = FALSE),
                               error = function(e) {
            cli::cli_alert_warning("bus_manifest.json unavailable ({conditionMessage(e)}); proceeding without sha verification")
            NULL
          })
          required <- c("opta_match_stats.parquet", "opta-catalog.json")
          optional <- c("opta_player_stats.parquet", "opta_skills.parquet",
                        "opta_xmetrics.parquet")
          failed_required <- character(0)
          for (f in c(required, optional)) {
            ok <- tryCatch({
              vb_download(repo, tag, f, file.path(opta_dir, f), manifest = manifest)
              TRUE
            }, vb_error = function(e) {
              if (f %in% required) {
                # Collect rather than stop: one run should surface EVERY
                # broken asset, matching the old bash loop's diagnosability.
                cli::cli_alert_danger("Required asset failed: {f} — {conditionMessage(e)}")
                failed_required <<- c(failed_required, f)
              } else {
                cli::cli_alert_warning("Skipped {f}: {conditionMessage(e)}")
              }
              FALSE
            })
            if (ok) cli::cli_alert_success("Verified {f}")
          }
          if (length(failed_required) > 0) {
            stop("Required asset(s) failed verification/download: ",
                 paste(failed_required, collapse = ", "))
          }
          EOF
          Rscript /tmp/vb_fetch_opta.R

          echo ""
          ls -lh "${{ runner.temp }}/pannadata/opta"

      - name: Download skills caches
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          CACHE_SKILLS="data-raw/cache-skills"
          mkdir -p "$CACHE_SKILLS"

          echo "Downloading skill caches..."
          for f in 01_match_stats.rds 02b_decay_params.rds 03_skill_spm.rds psr_league_offsets.parquet; do
            if gh release download predictions-cache --repo peteowen1/pannadata \
                 --pattern "$f" --dir "$CACHE_SKILLS" 2>/dev/null; then
              echo "  Downloaded $f"
            else
              echo "  WARNING: $f not found"
            fi
          done

          echo ""
          ls -lh "$CACHE_SKILLS"/*.rds "$CACHE_SKILLS"/*.parquet 2>/dev/null || echo "  No skill caches"

          # Validate prerequisites for step 8b
          if [ ! -f "$CACHE_SKILLS/01_match_stats.rds" ] && [ ! -f "$CACHE_SKILLS/01_match_stats_slim.rds" ]; then
            echo "FATAL: 01_match_stats(_slim).rds required for PSR snapshot"
            exit 1
          fi
          # Offsets are REQUIRED: every GHA weekly run until 2026-07-04 silently
          # built offset-free snapshots (offsets were never downloaded), mixing
          # conventions in the released parquet. 8b also hard-fails via
          # psr_require_offsets, but fail here first with a clearer message.
          if [ ! -f "$CACHE_SKILLS/psr_league_offsets.parquet" ]; then
            echo "FATAL: psr_league_offsets.parquet required (upload via upload_prediction_caches.R)"
            exit 1
          fi

      - name: Export weekly PSR snapshots
        env:
          PANNADATA_DIR: ${{ runner.temp }}/pannadata
          GITHUB_PAT: ${{ secrets.WORKFLOW_PAT }}
          # Hard-fail 8b if offsets can't be applied (env var, NOT an R flag:
          # 08b is sourced inside a step closure where globalenv flags are
          # invisible — same delivery pattern as PSR_FORCE_FULL_REBUILD).
          PSR_REQUIRE_OFFSETS: "1"
          # GHA has no local xmetrics_bymatch/ tree (panna#126) — read the
          # consolidated opta_xmetrics_bymatch.parquet from opta-latest instead.
          XMETRICS_SOURCE: remote
        run: |
          cat > /tmp/run_psr_weekly.R << 'EOF'
          pannadata_path <- Sys.getenv("PANNADATA_DIR", "../pannadata/data")
          opta_path <- file.path(pannadata_path, "opta")
          devtools::load_all()
          pannadata_dir(pannadata_path)
          opta_data_dir(opta_path)
          start_step <- "8b"
          # Run ONLY 8b: start_step="8b" (8.5) alone also enables step 09
          # (career_panna, 8.5 <= 9), which lacks its cache-opta prerequisites
          # here and failed silently every week. Preset run_steps explicitly
          # (run_skills_pipeline.R only builds it if it doesn't exist).
          run_steps <- list(
            step_01_compute_match_stats    = FALSE,
            step_02_estimate_skills        = FALSE,
            step_02b_optimize_params       = FALSE,
            step_03_skill_spm              = FALSE,
            step_04_skill_xrapm            = FALSE,
            step_05_skill_panna_ratings    = FALSE,
            step_06_seasonal_skill_ratings = FALSE,
            step_07_train_psr_model        = FALSE,
            step_08_export_skills          = FALSE,
            step_08b_export_psr_weekly     = TRUE,
            step_09_career_panna           = FALSE
          )
          source("data-raw/estimated-skills/run_skills_pipeline.R")
          EOF
          Rscript /tmp/run_psr_weekly.R

      # panna#123: refresh the live-PSV centering constants weekly so C_pop
      # tracks the season as it accumulates (and tournament leagues like the WC
      # appear/disappear with their windows). Runs AFTER the 8b export so a
      # constants failure can't block the PSR snapshot upload. 07c needs only
      # cache-skills/01_match_stats.rds + the coefficient CSVs in the checkout —
      # it deliberately does NOT enrich with xMetrics (see the note in 07c), so
      # no xmetrics_bymatch download is required. 07c hard-fails (no upload,
      # last good CSV stays on the bus) if an expected live-subset league is
      # missing from its output. The CSV is published to pannadata's blog-latest
      # release (data bus). NB: TODAY the blog's coefficient build
      # (build-stat-value-coefficients.mjs) still reads the LOCAL panna checkout
      # — wiring it to consume this blog-latest copy is inthegame-blog#371;
      # until that lands this upload keeps the bus fresh but has no consumer.
      # Cross-repo lockstep guard: 07c's LIVE_OBSERVABLE_FEATURES is a hand
      # transcription of what the blog's live scorer can build; the review
      # already caught it mis-transcribed once. Recompute the set from the
      # blog's actual stat-value.js and fail the cron loudly on drift.
      - name: Check live-feature lockstep vs blog stat-value.js
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          gh api repos/peteowen1/inthegame-blog/contents/football/stat-value.js \
            --jq '.content' | base64 -d > /tmp/stat-value.js
          STAT_VALUE_JS=/tmp/stat-value.js Rscript data-raw/estimated-skills/07c_check_live_features.R

      - name: Rebuild live-PSV centering constants (07c)
        env:
          PANNADATA_DIR: ${{ runner.temp }}/pannadata
          GITHUB_PAT: ${{ secrets.WORKFLOW_PAT }}
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          ALLOW_SUBSET_DROP: ${{ inputs.allow_subset_drop && 'true' || 'false' }}
        run: |
          cat > /tmp/run_07c.R << 'EOF'
          pannadata_path <- Sys.getenv("PANNADATA_DIR", "../pannadata/data")
          opta_path <- file.path(pannadata_path, "opta")
          devtools::load_all()
          pannadata_dir(pannadata_path)
          opta_data_dir(opta_path)
          source("data-raw/estimated-skills/07c_build_live_psv_constants.R")
          EOF
          Rscript /tmp/run_07c.R

          # Disappearance guard: a live_subset league present in the PUBLISHED CSV
          # must not silently vanish from the new one. 07c's own gate covers
          # failures it can see (fetch/enrich/scoring); this closes the remaining
          # hole (e.g. resolve_league_season wrongly returning NULL mid-tournament
          # -> league "legitimately" skipped -> green upload without it). A real
          # drop happens once, at season rollover after a tournament ends —
          # re-run with allow_subset_drop=true for that.
          mkdir -p /tmp/prev_csv
          gh release download blog-latest --repo peteowen1/pannadata \
            --pattern psv_live_constants.csv --dir /tmp/prev_csv || true
          if [ -f /tmp/prev_csv/psv_live_constants.csv ]; then
            prev=$(awk -F, 'NR>1 && $NF=="TRUE" {print $1}' /tmp/prev_csv/psv_live_constants.csv | sort -u)
            new=$(awk -F, 'NR>1 && $NF=="TRUE" {print $1}' inst/extdata/psv_live_constants.csv | sort -u)
            dropped=$(comm -23 <(echo "$prev") <(echo "$new") | grep -v '^$' || true)
            if [ -n "$dropped" ] && [ "${ALLOW_SUBSET_DROP}" != "true" ]; then
              echo "FATAL: live_subset league(s) dropped from constants CSV: $dropped"
              echo "If the tournament legitimately ended (season rollover), re-run with allow_subset_drop=true."
              exit 1
            fi
          fi

          echo "Uploading psv_live_constants.csv to pannadata blog-latest..."
          gh release upload blog-latest inst/extdata/psv_live_constants.csv \
            --repo peteowen1/pannadata --clobber

      - name: Snapshot summary
        if: always()
        run: |
          echo "## Weekly PSR Snapshot" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          OUT_FILE="${{ runner.temp }}/pannadata/opta/opta_psr_weekly.parquet"
          if [ -f "$OUT_FILE" ]; then
            SIZE=$(ls -lh "$OUT_FILE" | awk '{print $5}')
            echo "**Output:** opta_psr_weekly.parquet ($SIZE)" >> $GITHUB_STEP_SUMMARY
            echo "**Upload:** uploaded to \`opta-latest\` release" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** Snapshot FAILED (no output parquet found)" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      # Rebuild the skill estimates themselves, which nothing had refreshed
      # since 21 June 2026. opta_skills.parquet is a by-product of a manual
      # pipeline, and this job — the only thing that runs weekly — exported the
      # PSR snapshot and nothing else, so the blog's per-90 skill columns
      # described last season while the board stamped them with today's date.
      #
      # AFTER the snapshot, deliberately, and continue-on-error: the PSR
      # snapshot above works today and a heavier, less proven step must not be
      # able to take it down. The sibling RAPM pipeline lost its daily trigger
      # in June for exhausting a 16 GB runner, so treat this as unproven until
      # it has run green a few times.
      #
      # 01 -> 02 -> 08 is self-contained: 01 reads the raw opta_player_stats
      # already downloaded above (refreshed daily by the scrape, verified
      # current), 02 estimates the decay-weighted skills from it, 08 exports.
      # 08 is an EXPORT ONLY — it re-uploads whatever 02_skill_features.rds
      # holds — so it must never run without 01 and 02 in the same invocation,
      # or it would republish a stale cache under a fresh timestamp, which is
      # precisely the failure that emptied the blog's Player Stats page for
      # five weeks in August.
      - name: Rebuild and export the skill estimates
        continue-on-error: true
        timeout-minutes: 45
        env:
          GITHUB_PAT: ${{ secrets.WORKFLOW_PAT }}
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
          PANNADATA_DIR: ${{ runner.temp }}/pannadata
        run: |
          cat > /tmp/run_skills_rebuild.R << 'EOF'
          pannadata_path <- Sys.getenv("PANNADATA_DIR", "../pannadata/data")
          opta_path <- file.path(pannadata_path, "opta")
          devtools::load_all()
          pannadata_dir(pannadata_path)
          opta_data_dir(opta_path)
          # Explicit, like the block above: start_step numbering pulls in
          # neighbours that lack their prerequisites here and fail silently.
          run_steps <- list(
            step_01_compute_match_stats    = TRUE,
            step_02_estimate_skills        = TRUE,
            step_02b_optimize_params       = FALSE,
            step_03_skill_spm              = FALSE,
            step_04_skill_xrapm            = FALSE,
            step_05_skill_panna_ratings    = FALSE,
            step_06_seasonal_skill_ratings = FALSE,
            step_07_train_psr_model        = FALSE,
            step_08_export_skills          = TRUE,
            step_08b_export_psr_weekly     = FALSE,
            step_09_career_panna           = FALSE
          )
          source("data-raw/estimated-skills/run_skills_pipeline.R")
          EOF
          Rscript /tmp/run_skills_rebuild.R

      # A skipped or failed rebuild is not a reason to say nothing: the whole
      # point is that this file going stale was invisible for ten weeks. Report
      # the published vintage either way, so a run that quietly stopped
      # refreshing skills is visible in the job summary.
      - name: Report the published skills vintage
        if: always()
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_PAT }}
        run: |
          UPDATED=$(gh release view opta-latest --repo peteowen1/pannadata \
            --json assets -q '.assets[] | select(.name=="opta_skills.parquet") | .updatedAt' 2>/dev/null || echo "")
          echo "opta_skills.parquet on opta-latest: ${UPDATED:-UNKNOWN}"
          echo "**Skills vintage:** \`${UPDATED:-unknown}\`" >> $GITHUB_STEP_SUMMARY
          if [ -n "$UPDATED" ]; then
            AGE=$(( ( $(date -u +%s) - $(date -u -d "$UPDATED" +%s) ) / 86400 ))
            echo "  (${AGE} days old)"
            if [ "$AGE" -gt 14 ]; then
              echo "::warning::opta_skills.parquet is ${AGE} days old — the weekly rebuild is not landing."
            fi
          fi
