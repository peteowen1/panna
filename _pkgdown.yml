url: https://peteowen1.github.io/panna/

template:
  bootstrap: 5

navbar:
  structure:
    left: [intro, reference, articles]
    right: [search, github]
  components:
    articles:
      text: Articles
      menu:
      - text: Getting Started
        href: articles/getting-started.html
      - text: Player Ratings (EPR, PSR, Panna, Piero)
        href: articles/player-ratings.html
      - text: Pipeline Anatomy
        href: articles/pipeline-walkthrough.html
      - text: Match Prediction and Tournament Simulation
        href: articles/match-prediction.html
      - text: Data Access and Publishing
        href: articles/data-bus.html
      - text: Data Sources Guide
        href: articles/data-sources.html

articles:
- title: Getting Started
  navbar: ~
  contents:
  - getting-started
  - player-ratings
  - pipeline-walkthrough
  - match-prediction
  - data-bus
  - data-sources

reference:
- title: Data Loading - Opta
  desc: Load Opta player statistics (263 columns, 15 leagues)
  contents:
  - has_concept("opta loaders")

- title: Player Statistics
  desc: Aggregated player statistics by source
  contents:
  - has_concept("player statistics")

- title: RAPM Pipeline
  desc: Regularized Adjusted Plus-Minus model
  contents:
  - has_concept("rapm")

- title: SPM Pipeline
  desc: Statistical Plus-Minus model
  contents:
  - has_concept("spm")

- title: SPM Pipeline - Opta
  desc: Opta-specific SPM model with 80+ features
  contents:
  - has_concept("spm opta")

- title: Panna Ratings
  desc: Combined RAPM + SPM ratings
  contents:
  - has_concept("panna ratings")

- title: Possession Chain Analytics
  desc: Possession chain construction and aggregation
  contents:
  - has_concept("possession chains")

- title: EPV (Expected Possession Value)
  desc: Action-level player valuation from Opta event data
  contents:
  - has_concept("epv")

- title: Win Probability (WPA)
  desc: Win probability model and WPA credit assignment
  contents:
  - has_concept("win probability")

- title: Penalty Shootouts
  desc: Shootout detection, scoring, and WPA aggregation
  contents:
  - has_concept("penalty shootouts")

- title: EPR (Expected Possession Rating)
  desc: Decay-weighted Bayesian EPV ratings
  contents:
  - has_concept("epr")

- title: Estimated Skills
  desc: Bayesian decay-weighted skill estimation with position-specific priors
  contents:
  - has_concept("estimated skills")

- title: Match Prediction
  desc: XGBoost Poisson/multinomial match outcome prediction
  contents:
  - has_concept("match prediction")

- title: Expected Minutes Model
  desc: Player role classification and expected-minutes prediction for lineups
  contents:
  - has_concept("expected minutes")

- title: Season Simulation
  desc: Monte Carlo season projection
  contents:
  - has_concept("season simulation")

- title: World Cup 2026 Simulation
  desc: Bradley-Terry team ratings and knockout tournament simulation
  contents:
  - has_concept("world cup simulation")

- title: xDuel Models
  desc: Player-agnostic contextual win-probability for physical contests (aerial/take-on/tackle/containment) — the above-expected duel features that replaced the success ratios in PSR/PSV
  contents:
  - has_concept("xduel")

- title: Cross-League Offsets
  desc: Per-league PSR/EPR calibration via the same-season co-occurrence network
  contents:
  - has_concept("league offsets")

- title: Weather
  desc: Open-Meteo weather data for match conditions
  contents:
  - has_concept("weather")

- title: Network Centrality
  desc: Opponent quality adjustment via network analysis
  contents:
  - has_concept("centrality")

- title: Player Attribution
  desc: Zero-ablation player impact measurement
  contents:
  - has_concept("player attribution")

- title: Player Skill Rating (PSR) & Stat Value (PSV)
  desc: Composite player skill and per-game stat value metrics
  contents:
  - has_concept("psr")

- title: Data Distribution
  desc: GitHub Releases upload/download
  contents:
  - has_concept("data distribution")

- title: Cache Management
  desc: Local and remote cache operations
  contents:
  - has_concept("cache management")

- title: Player ID Canonicalisation
  desc: Map duplicate Opta player IDs to canonical identities
