# Listed by name, NOT has_concept("versebus"). The canonical-resync of
# versebus.R removed its `@family versebus` tags, so nothing in the SOURCE
# carries that concept any more -- has_concept() only kept matching because
# the committed man/vb_*.Rd still held \concept{versebus} from a document()
# run predating the removal. The next `devtools::document()` (mandatory
# whenever exports change) drops it from all 15 and pkgdown then fails with
# "15 topics missing from index", on main, where it cannot be pre-verified.
# Explicit names are immune to that. All 15 are exported, so pkgdown requires
# every one to appear here.
- title: Internal / Developer
  desc: "Data-bus utilities for release publish/download integrity (ECOSYSTEM-FIX-PLAN.md versebus pattern)"
  contents:
  - vb_asset_entry
  - vb_atomic_write
  - vb_cache_validate
  - vb_classify_error
  - vb_confirm_absent
  - vb_download
  - vb_generation
  - vb_guard_accumulate
  - vb_list_assets
  - vb_producer_info
  - vb_publish
  - vb_read_manifest
  - vb_read_prev_manifest
  - vb_sha256
  - vb_write_manifest
