  - has_concept("player id canonicalisation")

- title: Utilities
  desc: Helper functions
  contents:
  - has_concept("utilities")

- title: Competition Metadata
  desc: League and competition information
  contents:
  - has_concept("competition metadata")

- title: Validation
  desc: Model and data validation
  contents:
  - has_concept("validation")

- title: Constants
